[project]
name = "rpi-utils"
version = "0.1.0"
description = "A local control panel and Telegram manager for Raspberry Pi."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.115,<1",
	"python-telegram-bot>=21,<23",
	"uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
